services:
  mongo:
    image: mongo:7
    container_name: solo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - solo-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: development
    container_name: solo-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - JWT_SECRET=swp_dev_jwt_secret_change_in_prod
      - MONGO_URI=mongodb+srv://admin:4lger1E3945@solowithpeace.umgd8y2.mongodb.net/?appName=SolowithPeace
    command: sh -c "npm install --include=dev && npm run dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - solo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: solo-frontend
    ports:
      - "3000:3000"
    command: sh -c "npm install --include=dev && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:5000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_WEBPACK_USEPOLLING=true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - solo-network

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:

networks:
  solo-network:
    driver: bridge
