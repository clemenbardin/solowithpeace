services:
  backend:
    build:
      context: ./backend
      target: development
    container_name: solo-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET:-swp_jwt_secret_change_in_prod}
    command: sh -c "npm install --include=dev && npm run dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - sqlite_data:/app/db
    networks:
      - solo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: solo-frontend
    ports:
      - "3000:3000"
    command: sh -c "npm install --include=dev && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_WEBPACK_USEPOLLING=true
      - NEXT_PUBLIC_API_URL=http://backend:5000
    networks:
      - solo-network

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
  sqlite_data:

networks:
  solo-network:
    driver: bridge
