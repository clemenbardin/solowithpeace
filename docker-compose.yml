services:
  backend:
    build:
      context: ./backend
      target: development
    container_name: solo-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - JWT_SECRET=swp_dev_jwt_secret_change_in_prod
      - MONGO_URI=mongodb+srv://admin:4lger1E3945@solowithpeace.umgd8y2.mongodb.net/?appName=SolowithPeace
    command: sh -c "npm install --include=dev && npm run dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - solo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: solo-frontend
    ports:
      - "3000:3000"
    command: sh -c "npm install --include=dev && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:5000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_WEBPACK_USEPOLLING=true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - solo-network

  prometheus:
    image: prom/prometheus:latest
    container_name: solo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'   # Rétention 15 jours
      - '--web.enable-lifecycle'
    networks:
      - solo-network
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: solo-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - solo-network
    depends_on:
      - prometheus
  alertmanager:
    image: prom/alertmanager:latest
    container_name: solo-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - solo-network
  # Optionnel : métriques système des containers
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: solo-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - solo-network
  # Optionnel : logs centralisés
  loki:
    image: grafana/loki:latest
    container_name: solo-loki
    ports:
      - "3100:3100"
    networks:
      - solo-network
  promtail:
    image: grafana/promtail:latest
    container_name: solo-promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - solo-network
    depends_on:
      - loki

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
  prometheus_data:
  grafana_data:

networks:
  solo-network:
    driver: bridge
