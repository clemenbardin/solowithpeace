services:
  backend:
    build: ./backend
    container_name: solo-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET:-swp_jwt_secret_change_in_prod}
    command: sh -c "npm install --include=dev && npm run dev"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - solo-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    command: sh -c "npm install --include=dev && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_WEBPACK_USEPOLLING=true
      - NEXT_PUBLIC_API_URL=http://backend:5000
    networks:
      - solo-network

volumes:
  frontend_node_modules:
  frontend_next:

networks:
  solo-network:
    driver: bridge